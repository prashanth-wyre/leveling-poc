[project]
name = "wyre-level"
version = "0.1.0"
description = "Wyre bid leveling POC: API, AI pipeline and leveling engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "google-genai>=3.0",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]
