# Plugging policy for bid leveling. SYNTHETIC test document.
# Item keys match the "Key" column of each scope_sheet.xlsx.
version: 1
defaults:
  plug_when:
  - excluded
  - not_priced
  method: average_of_bidders
  fallback:
  - gc_estimate
  comparable_pool:
    exclude_self: true
    exclude_unresponsive: true
    min_pool: 2
    outlier_trim_pct: 50
    outlier_trim_min_pool: 3
quantity_normalization:
  convert_to: gc_unit
  threshold_pct: 5.0
  over_threshold: reextend_unit_rate_at_gc_quantity
  within_threshold: carry_as_bid
  lump_sum_with_quantity: use_implied_unit_rate
  lump_sum_without_quantity: flag_only
ai_market_price:
  provider: Gemini on Vertex AI with Google Search grounding
  region: Mountain West United States (Wyoming / Idaho)
  recency_months: 12
  min_sources: 2
  min_confidence: medium
  required_output:
  - unit_price
  - low
  - high
  - unit
  - confidence
  - sources with url and date
  acceptance_band_pct: 25
  flag_if_deviation_from_bidder_average_pct: 25
methods:
  gc_estimate: CM/GC estimate for the item (unit rate x GC quantity, or the lump sum)
  min_of_bidders: Lowest leveled value among comparable bidders
  max_of_bidders: Highest leveled value among comparable bidders
  average_of_bidders: Mean leveled value of comparable bidders
  median_of_bidders: Median leveled value of comparable bidders
  unit_rate_x_gc_qty: rate_source (min | average | median | max of comparable unit rates, or gc) x GC quantity
  fixed_allowance: Stated amount
  ai_market_price: Recent market unit price found by the LLM x GC quantity
packages:
  '07.50':
    allowances_all_bidders:
    - name: Additional flashing
      amount: 50000
    items:
      RA2:
        method: ai_market_price
        fallback:
        - average_of_bidders
        - gc_estimate
      ELD:
        method: unit_rate_x_gc_qty
        rate_source: median
        fallback:
        - gc_estimate
      FLUTE:
        method: average_of_bidders
        fallback:
        - gc_estimate
      TRANS:
        method: fixed_allowance
        amount: 75000
    manual_overrides:
    - bidder: Highline Roofing & Sheet Metal
      item: FLASH
      method: fixed_allowance
      amount: 100000
      reason: Flashing marked "Included" with no breakout; estimator judges the included scope insufficient
  '09.67':
    allowances_all_bidders:
    - name: Polished concrete touch-ups
      amount: 25000
    - name: Joint sealer at sealed concrete
      amount: 32000
    items:
      TC1:
        method: ai_market_price
        fallback:
        - median_of_bidders
        - gc_estimate
      TOP:
        method: average_of_bidders
        fallback:
        - gc_estimate
      MOIST:
        method: min_of_bidders
        min_pool: 1
        fallback:
        - gc_estimate
  '32.90':
    allowances_all_bidders: []
    items:
      PAVERS:
        method: ai_market_price
        fallback:
        - method: unit_rate_x_gc_qty
          rate_source: average
        - gc_estimate
      SILVA:
        method: ai_market_price
        fallback:
        - median_of_bidders
        - gc_estimate
      BENCH47:
        method: median_of_bidders
        fallback:
        - gc_estimate
      DRAIN:
        method: average_of_bidders
        fallback:
        - gc_estimate
      MAINT:
        method: max_of_bidders
        fallback:
        - gc_estimate
